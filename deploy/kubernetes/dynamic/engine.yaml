apiVersion: v1
kind: Namespace
metadata:
  name: byzantine-engine-dynamic
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: god
  namespace: byzantine-engine-dynamic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: god-cities
  namespace: byzantine-engine-dynamic
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: god-cities
  namespace: byzantine-engine-dynamic
subjects:
  - kind: ServiceAccount
    name: god
    namespace: byzantine-engine-dynamic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: god-cities
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: god
  namespace: byzantine-engine-dynamic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: god-dynamic
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: god-dynamic
    spec:
      serviceAccountName: god
      containers:
        - name: god
          image: byzantine-god:k8s-dynamic
          imagePullPolicy: IfNotPresent
          env:
            - name: CITY_RUNTIME
              value: kubernetes
            - name: CITY_IMAGE
              value: byzantine-city:k8s-dynamic
            - name: N_CITIES
              value: "5"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: god
  namespace: byzantine-engine-dynamic
spec:
  selector:
    app.kubernetes.io/instance: god-dynamic
  ports:
    - port: 8000
      targetPort: http
