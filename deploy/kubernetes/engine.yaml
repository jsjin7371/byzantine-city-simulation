apiVersion: apps/v1
kind: Deployment
metadata:
  name: god
  namespace: byzantine-engine-static
  labels:
    app.kubernetes.io/part-of: byzantine-engine-static
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: god
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: god
        app.kubernetes.io/part-of: byzantine-engine-static
    spec:
      automountServiceAccountToken: false
      containers:
        - name: god
          image: byzantine-god:k8s-static
          imagePullPolicy: IfNotPresent
          env:
            - name: N_CITIES
              value: "5"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: god
  namespace: byzantine-engine-static
  labels:
    app.kubernetes.io/part-of: byzantine-engine-static
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: god
  ports:
    - name: http
      port: 8000
      targetPort: http
---
