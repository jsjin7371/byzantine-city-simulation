# 프론트 + API + MySQL + 엔진(god 1개, city 5개)

x-city: &city # 아래에서 사용되는 *city (yml의 앵커라는 개념)
  build:
    context: ./engine
    dockerfile: Dockerfile.city
  image: byzantine-city   # city 5곳이 같은 이미지 사용

services:
  # ---------- 프론트엔드 ----------
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  god:
    build:
      context: ./engine
      dockerfile: Dockerfile.god
    environment:
      N_CITIES: 5
    depends_on: [city-1, city-2, city-3, city-4, city-5]

  # *city는 city라는 이름의 앵커를 참조하여, 각 city 서비스에 공통 설정을 적용
  city-1: { <<: *city, environment: { CITY_ID: 1 } } 
  city-2: { <<: *city, environment: { CITY_ID: 2 } }
  city-3: { <<: *city, environment: { CITY_ID: 3 } }
  city-4: { <<: *city, environment: { CITY_ID: 4 } }
  city-5: { <<: *city, environment: { CITY_ID: 5 } }

  # ---------- 백엔드 (API + DB) ----------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: byzantine
      MYSQL_USER: ${MYSQL_USER:-byzantine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-byzantine}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3307:3306"   # PC에 MySQL이 이미 있어도 겹치지 않게 3307
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-byzantine}:${MYSQL_PASSWORD:-byzantine}@mysql:3306/byzantine?charset=utf8mb4
      GOD_MODE: ${GOD_MODE:-http}   # http: 실제 God·City 사용 / mock: 엔진 없이 백엔드 안의 가짜 God
      GOD_URL: http://god:8000
      N_CITIES: 5
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mysql-data:
