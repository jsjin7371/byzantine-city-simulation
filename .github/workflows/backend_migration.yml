name: Backend Migration

# Alembic 마이그레이션을 실제 MySQL에 적용해 보고, 모델(models.py)과 어긋나지 않았는지 검사
# pytest는 SQLite + create_all로 테이블을 만들기 때문에 마이그레이션 자체는 검사하지 못함
# models.py를 바꾸고 마이그레이션을 안 만들면 alembic check 단계에서 실패함

on:
  pull_request:
    branches: [develop, "release/**", main]
    paths:
      - "backend/**"
      - ".github/workflows/backend_migration.yml"
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend_migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic:
    runs-on: ubuntu-latest

    # docker-compose.yml과 같은 MySQL 버전을 테스트용으로 띄움 (작업이 끝나면 사라짐)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: byzantine
          MYSQL_USER: byzantine
          MYSQL_PASSWORD: byzantine
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # MySQL이 접속을 받을 준비가 될 때까지 다음 단계로 넘어가지 않음
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    # alembic/env.py가 이 주소로 접속함
    env:
      DATABASE_URL: mysql+pymysql://byzantine:byzantine@127.0.0.1:3306/byzantine?charset=utf8mb4

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 빈 DB에 처음부터 끝까지 마이그레이션이 적용되는지 확인
      - name: 마이그레이션 적용 (upgrade head)
        run: python -m alembic upgrade head

      # 모델과 DB 스키마를 비교해서 차이가 있으면 실패 (새 마이그레이션이 필요하다는 뜻)
      - name: 모델과 마이그레이션 비교 (alembic check)
        run: python -m alembic check

      # 되돌리기(downgrade)도 동작하는지 확인 후 다시 적용
      - name: 되돌리기 후 재적용
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
