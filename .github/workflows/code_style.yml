name: Code Style

# 백엔드 Python 코드를 Ruff로 검사
# 버전과 규칙을 고정해서 Ruff가 업데이트돼도 검사 기준이 바뀌지 않게 함
# E4: import 위치 / E7: 문장 오류(lambda 할당 등) / E9: 문법 오류 / F: 정의되지 않은 이름, 사용하지 않는 import 등

on:
  pull_request:
    branches: [develop, "release/**", main]
    paths:
      - "backend/**"
      - ".github/workflows/code_style.yml"
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/code_style.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff 설치
        run: pip install ruff==0.17.4
      - name: Ruff 검사
        run: ruff check --isolated --select E4,E7,E9,F --output-format=github backend
